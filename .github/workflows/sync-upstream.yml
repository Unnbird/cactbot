name: Sync Upstream

on:
  schedule:
    - cron: '0 18 * * *' # 每天 UTC 18:00 (台灣時間 02:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Unnbird/cactbot' }}
    steps:
      - name: Checkout main-unnbird
        uses: actions/checkout@v6
        with:
          ref: main-unnbird
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/OverlayPlugin/cactbot.git
          git fetch upstream main

      - name: Merge upstream/main
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push to main-unnbird
        run: git push origin main-unnbird

      - name: Open issue on merge conflict
        if: ${{ failure() && steps.merge.outputs.conflict == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `自動同步上游失敗:合併衝突 (${today})`,
              body: [
                '自動將 `OverlayPlugin/cactbot` main 合併進 `main-unnbird` 時發生衝突,已中止合併。',
                '請手動處理:',
                '',
                '```sh',
                'git fetch upstream main',
                'git checkout main-unnbird',
                'git merge upstream/main',
                '# 解決衝突後',
                'git add -A',
                'git commit',
                'git push origin main-unnbird',
                '```',
              ].join('\n'),
            });
